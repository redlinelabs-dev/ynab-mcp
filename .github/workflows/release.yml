name: Release

# release-please keeps versioning + CHANGELOG via Release PRs. Merging a Release PR
# publishes @redlinelabs/ynab-mcp to npm (ADR-0005) — the stdio quick-start path —
# and the self-hosted Docker image remains the deploy path for the remote server
# (docs/DEPLOY.md, ADR-0004).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance — no token secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5, which does the OIDC exchange itself
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Auth comes from npm's trusted-publisher config for this repo + workflow
      # (npmjs.com package settings); provenance is generated automatically under OIDC.
      - run: npm publish
