name: Release

# release-please keeps versioning + CHANGELOG via Release PRs. Merging a Release PR
# publishes @redlinelabs/ynab-mcp to npm (ADR-0005) — the stdio quick-start path —
# and the self-hosted Docker image remains the deploy path for the remote server
# (docs/DEPLOY.md, ADR-0004).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance — no token secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange; fail legibly if the
      # runner's bundled npm is ever older instead of dying cryptically inside npm publish.
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          export NPM_VERSION
          node -e "const [M, m, p] = process.env.NPM_VERSION.split('.').map(Number); if (M < 11 || (M === 11 && (m < 5 || (m === 5 && p < 1)))) { console.error('npm ' + process.env.NPM_VERSION + ' is too old for trusted publishing (need >= 11.5.1)'); process.exit(1); }"
      - run: npm ci
      - run: npm run build
      # Auth comes from npm's trusted-publisher config for this repo + workflow
      # (npmjs.com package settings); provenance is generated automatically under OIDC.
      - run: npm publish
