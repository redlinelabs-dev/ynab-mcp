<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source for site/public/og.png — the og:image / twitter:image link-unfurl card.

    Not served: this file lives outside site/public/ on purpose. The served artefact is the
    committed PNG, so the site stays self-contained (no card-rendering service, no build-time
    image dependency). Regenerate after editing with any SVG rasteriser, e.g.

        rsvg-convert -w 1200 -h 630 site/assets/og-card.svg -o site/public/og.png

    Palette is the landing page's dark theme (site/src/pages/index.astro): bg #0c130f,
    panel #121d17, border #223229, text #eaf3ee, muted #a6b8ad, accent #3fbf85, plus the
    favicon's #1f6f4d mark. Wording is copied from the landing page's h1 and eyebrow so the
    card can't drift from what the page actually says. Deliberately carries no tool/toolset
    counts: those are pinned to the code by test/docs.test.ts for text, and an image can't be
    pinned the same way.
  -->
  <rect width="1200" height="630" fill="#0c130f"/>
  <rect x="0" y="0" width="1200" height="8" fill="#3fbf85"/>

  <!-- the favicon mark, scaled up -->
  <rect x="80" y="96" width="96" height="96" rx="21" fill="#1f6f4d"/>
  <text x="128" y="162" font-family="monospace"
        font-size="52" font-weight="700" fill="#eafff2" text-anchor="middle">$</text>

  <text x="200" y="146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#eaf3ee">ynab-mcp</text>
  <text x="202" y="184" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#a6b8ad" letter-spacing="2">MODEL CONTEXT PROTOCOL SERVER FOR YNAB</text>

  <text x="80" y="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" fill="#eaf3ee">Point an AI agent at your budget.</text>
  <text x="80" y="408" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" fill="#3fbf85">Nothing moves without you asking.</text>

  <rect x="80" y="470" width="620" height="72" rx="12" fill="#121d17" stroke="#223229" stroke-width="2"/>
  <text x="112" y="516" font-family="monospace"
        font-size="26" fill="#baf4d5">YNAB_DEMO=1 npx @redlinelabs/ynab-mcp</text>

  <text x="1120" y="516" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="24" fill="#6d7d74" text-anchor="end">ynab-mcp.redlinelabs.dev</text>
</svg>
